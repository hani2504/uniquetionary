<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>unique:tionary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style>
  /* Layout: white Swiss grid, one mint accent. Landing sphere → word list with big numerals-style headwords → grey projects board with mint tiles. Side drawer holds search. */
  :root {
    --bg: #ffffff;
    --ink: #0e0e0e;
    --muted: #8a8a8a;
    --line: #d9d9d9;
    --mint: #a6f7c8;
    --mint-deep: #5fe39a;
    --board: #f3f3f3;
    --tile-dark: #141414;
    --font: "Inter Tight", "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
    --font-ko: "Noto Sans KR", "Inter Tight", "Apple SD Gothic Neo", sans-serif;
    --gutter: 16px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* top bar */
  .bar { position: fixed; z-index: 20; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--gutter) 10px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .bar.solid { background: var(--bg); pointer-events: auto; }
  section { scroll-margin-top: 60px; }
  .logo { width: 52px; height: 26px; display: block; color: var(--ink); }
  .brand { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; text-decoration: none; color: var(--ink); }
  .brand b { font-weight: 300; color: var(--muted); }
  .menu-btn { justify-self: end; width: 44px; height: 44px; border: 0; border-radius: 6px; background: var(--mint); cursor: pointer; display: grid; place-items: center; }
  .menu-btn svg { width: 16px; height: 16px; }

  /* landing */
  .hero { position: relative; min-height: 100svh; display: grid; place-items: center; overflow: hidden; }
  .sphere { position: relative; isolation: isolate; width: min(86vw, 560px); aspect-ratio: 1; max-width: 100%; touch-action: pan-y; cursor: grab; }
  .sphere.dragging { cursor: grabbing; }
  .chip3d { position: absolute; left: 50%; top: 50%; white-space: nowrap; padding: 2px 5px; font-size: 10px; line-height: 1.2; border-radius: 1px;
    will-change: transform, opacity; user-select: none; }
  .chip3d.k { font-family: var(--font-ko); }
  .chip3d.t0 { background: var(--tile-dark); color: #fff; }
  .chip3d.t1 { background: var(--mint); color: var(--ink); }
  .chip3d.t2 { background: #e9e9e9; color: var(--ink); }
  .chip3d.t3 { background: #fff; color: var(--ink); border: 1px solid var(--ink); }
  button.chip3d { border: 0; font-family: var(--font); cursor: pointer; }
  button.chip3d.k { font-family: var(--font-ko); }
  button.chip3d.t3 { border: 1px solid var(--ink); }
  button.chip3d:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .shuffle { border: 0; background: none; padding: 0; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .word { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.22); display: grid; place-items: center; padding: 16px; }
  .word[hidden] { display: none; }
  .word-card { position: relative; width: min(560px, 100%); max-height: 86vh; overflow-y: auto; background: var(--bg); border-radius: 6px; padding: 52px 20px 4px; }
  .word-card .entry { border-bottom: 0; }
  .word-card .menu-btn { position: absolute; top: 12px; right: 12px; }
  .hero-foot { position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .hero-foot a { color: var(--ink); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }

  /* words */
  .wrap { max-width: 720px; margin: 0 auto; padding-inline: var(--gutter); }
  .words { padding-block: 72px 96px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .search { position: relative; display: block; }
  .search input { width: 100%; border: 0; border-bottom: 1px solid var(--ink); padding: 14px 0 12px 28px; font: 300 26px/1.2 var(--font);
    background: transparent; color: var(--ink); outline: none; border-radius: 0; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search input::placeholder { color: #bdbdbd; }
  .search svg { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; }
  .filter { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; min-height: 28px; }
  .filter button { border: 0; background: var(--mint); padding: 4px 10px; border-radius: 4px; font-size: 13px; cursor: pointer; }

  .entry { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); column-gap: 18px; row-gap: 14px; padding-block: 28px 30px; border-bottom: 1px solid var(--line); }
  .entry .head { font: 300 clamp(40px, 9vw, 56px)/1 var(--font-ko); letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .entry .tag { font-size: 12px; color: var(--muted); padding-top: 2px; }
  .entry .head.long { font-size: clamp(30px, 7vw, 44px); }
  @media (max-width: 599px) { .entry { grid-template-columns: minmax(0, 1fr); row-gap: 10px; } }
  .entry .body { word-break: keep-all; overflow-wrap: anywhere; grid-column: 1 / -1; display: grid; gap: 6px; max-width: 60ch; }
  .entry .tr { display: grid; grid-template-columns: 26px 1fr; gap: 4px; }
  .entry .tr span:first-child { font-size: 11px; color: var(--muted); padding-top: 2px; }
  .entry .def { margin-top: 6px; }
  .entry .ex { font-family: var(--font-ko); color: #4a4a4a; }
  mark { background: var(--mint); color: inherit; }
  .empty { padding: 40px 0; color: var(--muted); }

  /* projects board */
  .board { background: var(--board); padding-block: 0 72px; }
  .pixels { height: 44px; display: grid; grid-template-columns: repeat(auto-fill, 11px); grid-auto-rows: 11px; overflow: hidden; }
  .pixels i { display: block; }
  .board h2 { margin: 56px 0 40px; text-align: center; font: 400 clamp(28px, 6vw, 40px)/1.12 var(--font); letter-spacing: -0.02em; text-wrap: balance; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { min-height: 96px; border: 0; border-radius: 3px; background: var(--mint); cursor: pointer; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 2px; padding: 16px 12px; text-align: center; transition: background .15s; }
  .tile:hover { background: var(--mint-deep); }
  .tile strong { font-weight: 500; font-size: 18px; letter-spacing: -0.01em; }
  .tile span { font-size: 12px; color: #3b3b3b; }
  .tile.sphere-tile { background: #fff; border: 1px solid var(--line); }
  .tile.sphere-tile:hover { border-color: var(--ink); background: #fff; }
  .board h3 { margin: 56px 0 18px; font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: .04em; text-align: center; }
  .credit { text-align: center; color: var(--muted); font-size: 12px; margin-top: 56px; }

  /* drawer */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .drawer { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--bg);
    transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 16px); }
  body.open .scrim { opacity: 1; pointer-events: auto; }
  body.open .drawer { transform: none; }
  .drawer-top { display: flex; justify-content: space-between; align-items: center; }
  .drawer nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 6px; }
  .drawer nav button { border: 1px solid var(--line); background: #fff; padding: 5px 10px; border-radius: 4px; font-size: 13px; cursor: pointer; }
  .drawer nav button.on { background: var(--mint); border-color: var(--mint); }
  .drawer .results { overflow-y: auto; flex: 1; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); }
  .drawer .entry { padding-block: 20px; }
  .drawer .entry .head { font-size: 34px; }

  @media (min-width: 900px) {
    .tiles { grid-template-columns: 1fr 1fr 1fr; }
    .entry { column-gap: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .drawer, .scrim { transition: none; }
  }
</style>

<header class="bar" id="bar">
  <svg class="logo" viewBox="0 0 52 26" aria-hidden="true" id="logo"></svg>
  <a class="brand" href="#top">unique<b>:</b>tionary</a>
  <button class="menu-btn" id="menuBtn" aria-label="Открыть поиск и меню">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
</header>

<section class="hero" id="top">
  <div class="sphere" id="sphere" aria-label="Облако слов"></div>
  <div class="hero-foot">
    <span>made by Han Vika</span>
    <button class="shuffle" id="shuffle" type="button"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 5.5A5 5 0 1 0 12.5 9M12 1.5v4H8"/></svg>다른 단어</button>
    <a href="#words"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 1v11m0 0L1 9m3 3 3-3M9 1h4"/></svg>Scroll Down</a>
  </div>
</section>

<section class="words" id="words">
  <div class="wrap">
    <div class="section-head"><span class="eyebrow">Словарь · 사전 · Dictionary</span><span class="eyebrow" id="count"></span></div>
    <label class="search">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7.5" cy="7.5" r="5.5"/><path d="m12 12 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="검색 · поиск · search" autocomplete="off">
    </label>
    <div class="filter" id="filter"></div>
    <div id="list"></div>
  </div>
</section>

<section class="board" id="projects">
  <div class="pixels" id="pixels" aria-hidden="true"></div>
  <div class="wrap">
    <h2>Main projects</h2>
    <div class="tiles" id="projectTiles"></div>
    <h3>СФЕРЫ · SPHERES</h3>
    <div class="tiles" id="sphereTiles"></div>
    <p class="credit">unique:tionary · made by Han Vika</p>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Поиск">
  <div class="drawer-top">
    <a class="brand" href="#top" data-close>unique<b>:</b>tionary</a>
    <button class="menu-btn" id="closeBtn" aria-label="Закрыть">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m3 3 10 10M13 3 3 13"/></svg>
    </button>
  </div>
  <label class="search" style="margin-top:18px">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7.5" cy="7.5" r="5.5"/><path d="m12 12 4.5 4.5"/></svg>
    <input id="dq" type="search" placeholder="검색 · поиск · search" autocomplete="off">
  </label>
  <nav id="dnav"></nav>
  <div class="results" id="dlist"></div>
</aside>

<div class="word" id="word" hidden role="dialog" aria-modal="true" aria-label="단어">
  <div class="word-card">
    <button class="menu-btn" id="wordClose" aria-label="닫기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m3 3 10 10M13 3 3 13"/></svg></button>
    <div id="wordBody"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let data = { folders: [], terms: [] };
let active = null;           // folder id for the main list
let dActive = null;          // folder id inside the drawer

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hl = (s, q) => {
  const t = String(s ?? "");
  if (!q) return esc(t);
  const i = t.toLowerCase().indexOf(q);
  return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
};
const folderName = (id) => data.folders.find((f) => f.id === id)?.name ?? id;

function match(folder, q) {
  return data.terms
    .filter((t) => !folder || t.folders.includes(folder))
    .filter((t) => !q || [t.ko, t.ru, t.en, t.definition, t.example].join(" ").toLowerCase().includes(q))
    .sort((a, b) => a.ko.localeCompare(b.ko, "ko"));
}

function entryHTML(t, q) {
  return `<article class="entry">
    <div class="head${t.ko.length > 7 ? " long" : ""}">${hl(t.ko, q)}</div>
    <div class="tag">${t.folders.map(folderName).map(esc).join(" · ")}</div>
    <div class="body">
      <div class="tr"><span>RU</span><span>${hl(t.ru, q)}</span></div>
      <div class="tr"><span>EN</span><span>${hl(t.en, q)}</span></div>
      ${t.definition ? `<div class="def">${hl(t.definition, q)}</div>` : ""}
      ${t.example ? `<div class="ex">${hl(t.example, q)}</div>` : ""}
    </div>
  </article>`;
}

function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const terms = match(active, q);
  $("count").textContent = `${terms.length} / ${data.terms.length}`;
  $("filter").innerHTML = active ? `<button data-clear>${esc(folderName(active))} ✕</button>` : "";
  $("list").innerHTML = terms.length ? terms.map((t) => entryHTML(t, q)).join("") : `<p class="empty">Ничего не найдено. 결과 없음.</p>`;
}

function renderDrawer() {
  const q = $("dq").value.trim().toLowerCase();
  $("dnav").innerHTML = [`<button data-f="" class="${dActive ? "" : "on"}">Все</button>`]
    .concat(data.folders.map((f) => `<button data-f="${f.id}" class="${dActive === f.id ? "on" : ""}">${esc(f.name)}</button>`)).join("");
  const terms = match(dActive, q);
  $("dlist").innerHTML = terms.length ? terms.map((t) => entryHTML(t, q)).join("") : `<p class="empty">Ничего не найдено.</p>`;
}

function renderBoard() {
  const count = (id) => data.terms.filter((t) => t.folders.includes(id)).length;
  const tiles = (kind, cls) => data.folders.filter((f) => f.kind === kind).map((f, i) => {
    const col = [1, 2, 2, 1][i % 4], row = Math.floor(i / 4) * 3 + [1, 1, 2, 3][i % 4];
    return `<button class="tile ${cls}" data-f="${f.id}" style="--c:${col};--r:${row}"><strong>${esc(f.name)}</strong><span>${count(f.id)} слов</span></button>`;
  }).join("");
  $("projectTiles").innerHTML = tiles("project", "");
  $("sphereTiles").innerHTML = tiles("sphere", "sphere-tile");
}

/* staggered placement like the reference on narrow screens */
const stagger = document.createElement("style");
stagger.textContent = `@media (max-width: 899px){ #projectTiles .tile{grid-column:var(--c);grid-row:var(--r)} }`;
document.head.appendChild(stagger);

function openFolder(id) {
  active = id; $("q").value = ""; renderList();
  $("words").scrollIntoView();
}

/* drawer */
const setOpen = (on) => { document.body.classList.toggle("open", on); if (on) setTimeout(() => $("dq").focus(), 200); };
$("menuBtn").onclick = () => setOpen(true);
$("closeBtn").onclick = () => setOpen(false);
$("scrim").onclick = () => setOpen(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
$("drawer").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) setOpen(false); });
$("dq").addEventListener("input", renderDrawer);
$("dnav").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; dActive = b.dataset.f || null; renderDrawer(); });

$("q").addEventListener("input", renderList);
$("filter").addEventListener("click", (e) => { if (e.target.closest("[data-clear]")) { active = null; renderList(); } });
document.querySelector(".board").addEventListener("click", (e) => { const b = e.target.closest(".tile"); if (b) openFolder(b.dataset.f); });

/* header turns solid once the landing scrolls away */
addEventListener("scroll", () => $("bar").classList.toggle("solid", scrollY > innerHeight * 0.6), { passive: true });

/* sunburst logo */
(() => {
  let p = "";
  for (let i = 0; i <= 24; i++) {
    const a = Math.PI * (i / 24);
    p += `M26 25 L${(26 - Math.cos(a) * 25).toFixed(2)} ${(25 - Math.sin(a) * 24).toFixed(2)} `;
  }
  $("logo").innerHTML = `<path d="${p}" stroke="currentColor" stroke-width="0.9" fill="none"/><path d="M1 25.5h50" stroke="currentColor" stroke-width="1"/>`;
})();

/* pixel strip */
(() => {
  let h = "";
  for (let i = 0; i < 4 * 160; i++) {
    const row = Math.floor(i / 160), r = Math.random();
    const p = [0.18, 0.12, 0.08, 0.04][row];
    h += `<i style="background:${r < p ? "var(--mint)" : r < p * 2.2 ? "#ffffff" : "transparent"}"></i>`;
  }
  $("pixels").style.gridTemplateColumns = "repeat(160, 11px)";
  $("pixels").innerHTML = h;
})();

/* rotating word sphere: a random handful of words each visit, tap one to review it */
const SPHERE_COUNT = 48;
let sphereNodes = [], sphereCountNow = 0;
function pickWords() {
  const pool = data.terms.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const words = [];
  pool.slice(0, SPHERE_COUNT / 3).forEach((t) => words.push(
    { t, s: t.ko, k: true },
    { t, s: t.en.split(" (")[0].split(" / ")[0], k: false },
    { t, s: t.ru.split(" (")[0], k: false }));
  for (let i = words.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [words[i], words[j]] = [words[j], words[i]]; }
  return words;
}
function fillSphere() {
  const el = $("sphere");
  el.querySelectorAll(".chip3d").forEach((c) => c.remove());
  const picked = pickWords(); sphereCountNow = picked.length;
  sphereNodes = picked.map((w, i) => {
    const d = document.createElement("button");
    d.type = "button";
    d.className = `chip3d t${i % 4}${w.k ? " k" : ""}`;
    d.textContent = w.s.length > 16 ? w.s.slice(0, 15) + "…" : w.s;
    d.dataset.i = i;
    el.appendChild(d);
    // evenly spaced points on a sphere, so the cloud reads as a clean ball
    const n = sphereCountNow, y = 1 - (i / (n - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.39996;
    return { d, t: w.t, x: Math.cos(th) * r, y, z: Math.sin(th) * r };
  });
}
function buildSphere() {
  const el = $("sphere");
  fillSphere();
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ay = 0, ax = -0.25, vy = still ? 0 : 0.0035, drag = null;
  el.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, chip: e.target.closest(".chip3d") };
    el.classList.add("dragging"); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if (!drag) return;
    ay += (e.clientX - drag.x) * 0.008; ax = Math.max(-1.2, Math.min(1.2, ax + (e.clientY - drag.y) * 0.006));
    drag.x = e.clientX; drag.y = e.clientY; draw();
  });
  el.addEventListener("pointerup", (e) => {
    const tap = drag && drag.chip && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6;
    if (tap) openWord(sphereNodes[+drag.chip.dataset.i].t);
    drag = null; el.classList.remove("dragging");
  });
  el.addEventListener("pointercancel", () => { drag = null; el.classList.remove("dragging"); });
  el.addEventListener("keydown", (e) => { const c = e.target.closest(".chip3d"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openWord(sphereNodes[+c.dataset.i].t); } });
  $("shuffle").onclick = () => { fillSphere(); draw(); };
  function draw() {
    const R = el.clientWidth * 0.42, cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
    for (const p of sphereNodes) {
      const x1 = p.x * cy + p.z * sy, z1 = -p.x * sy + p.z * cy;
      const y2 = p.y * cx - z1 * sx, z2 = p.y * sx + z1 * cx;
      const s = 0.55 + (z2 + 1) * 0.35;
      p.d.style.transform = `translate(-50%,-50%) translate3d(${(x1 * R).toFixed(1)}px,${(y2 * R).toFixed(1)}px,0) scale(${s.toFixed(3)})`;
      p.d.style.opacity = (0.08 + (z2 + 1) * 0.46).toFixed(2);
      p.d.style.zIndex = Math.round((z2 + 1) * 100);
    }
  }
  (function loop() { if (!drag) ay += vy; draw(); if (!still) requestAnimationFrame(loop); })();
  addEventListener("resize", draw);
}

/* word card for review */
function openWord(t) {
  $("wordBody").innerHTML = entryHTML(t, "");
  $("word").hidden = false;
  $("wordClose").focus();
}
const closeWord = () => { $("word").hidden = true; };
$("wordClose").onclick = closeWord;
$("word").addEventListener("click", (e) => { if (e.target.id === "word") closeWord(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeWord(); });

fetch("terms.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((d) => { data = d; renderList(); renderDrawer(); renderBoard(); buildSphere(); })
  .catch(() => { $("list").innerHTML = `<p class="empty">Не удалось загрузить terms.json</p>`; });
</script>
